name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Backend — lint и тесты
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check app tests
          uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend — тесты, типы, сборка
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    # Деплой включается, когда в репозитории заданы секреты SSH_HOST, SSH_USER, SSH_KEY
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      APP_PORT: ${{ vars.APP_PORT || '80' }}
      IMAGE: sqoch-tickets:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверка секретов
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "Секреты SSH не заданы — деплой пропущен"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Сборка образа
        if: steps.check.outputs.skip != 'true'
        run: docker build -t "$IMAGE" .
      - name: Доставка на сервер и запуск
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          SSH="ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST"
          $SSH "mkdir -p ~/sqoch-tickets"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new docker-compose.yml "$SSH_USER@$SSH_HOST:~/sqoch-tickets/"
          docker save "$IMAGE" | gzip | $SSH "gunzip | docker load"
          $SSH "cd ~/sqoch-tickets && IMAGE=$IMAGE PORT=$APP_PORT docker compose up -d --no-build --remove-orphans && docker image prune -f"
          sleep 5
          $SSH "curl -fsS http://127.0.0.1:$APP_PORT/api/health"
